<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlocPlay Règlement V2 - Sécurisé</title>
<style>
* {
    box-sizing: border-box;
}

body {
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    font-family: 'Segoe UI', 'Arial', system-ui, sans-serif;
    padding: 20px;
}

.container {
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(10px);
    border-radius: 32px;
    padding: 32px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 25px 45px rgba(0,0,0,0.4), 0 0 0 1px rgba(88, 101, 242, 0.2);
}

h2 {
    color: white;
    text-align: center;
    margin-bottom: 28px;
    font-weight: 600;
    letter-spacing: -0.3px;
    font-size: 26px;
}

.input-group {
    margin-bottom: 24px;
}

label {
    display: block;
    color: #cbd5e1;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 500;
}

input {
    width: 100%;
    padding: 14px 18px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 20px;
    color: white;
    font-size: 16px;
    transition: all 0.2s ease;
    outline: none;
}

input:focus {
    border-color: #5865F2;
    box-shadow: 0 0 0 3px rgba(88, 101, 242, 0.3);
}

button {
    background: #5865F2;
    color: white;
    border: none;
    padding: 14px 20px;
    border-radius: 40px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    transition: transform 0.1s ease, background 0.2s;
    margin-top: 8px;
}

button:active {
    transform: scale(0.97);
}

button:disabled {
    background: #4a4e6b;
    cursor: not-allowed;
    opacity: 0.6;
    transform: none;
}

.error-msg {
    color: #f87171;
    background: rgba(248, 113, 113, 0.1);
    border-radius: 16px;
    padding: 12px;
    font-size: 14px;
    text-align: center;
    margin-top: 16px;
    display: none;
    border-left: 3px solid #f87171;
}

.success-msg {
    color: #4ade80;
    background: rgba(74, 222, 128, 0.1);
    border-radius: 16px;
    padding: 12px;
    font-size: 14px;
    text-align: center;
    margin-top: 16px;
    display: none;
    border-left: 3px solid #4ade80;
}

.send-area {
    margin-top: 24px;
    text-align: center;
}

#sendBtn {
    background: #10b981;
    margin-top: 8px;
}

#sendBtn:disabled {
    background: #3b7c5e;
}

.locked {
    opacity: 0.5;
    filter: grayscale(0.1);
}

hr {
    border-color: #334155;
    margin: 20px 0;
}

.status-badge {
    text-align: center;
    font-size: 13px;
    margin-bottom: 16px;
    padding: 6px;
    border-radius: 40px;
    background: #1e293b;
    color: #94a3b8;
}
</style>
</head>
<body>

<div class="container">
    <h2>🔐 BlocPlay · Règlement</h2>
    <div class="status-badge" id="statusBadge">🔒 Authentification requise</div>
    
    <div class="input-group">
        <label>👤 Identifiant</label>
        <input type="text" id="username" placeholder="Identifiant" autocomplete="off">
    </div>
    
    <div class="input-group">
        <label>🔑 Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••">
    </div>
    
    <button id="loginBtn">🚪 Se connecter & déverrouiller</button>
    
    <div id="errorMsg" class="error-msg"></div>
    <div id="successMsg" class="success-msg"></div>
    
    <hr>
    
    <div class="send-area">
        <button id="sendBtn" disabled>📜 Envoyer les règles (verrouillé)</button>
    </div>
</div>

<script>
const ENCRYPTED_WEBHOOK_B64 = "phbICqSScP+Ku/GDYoQpR9SCSszLkBZjrsP1dbarQ6GgHHsl3oY4T57YNlXX1a1rUbLrkqbBYSrG6uHXXv0IuwOx9V1b65Ni9b1o6IVoVQapGY1h+MGM7zlSOCvozsRfOnnJOilHYea9jJU3f8jSjC17XubjsiO2HFeZV+7+OPXullJYGKqN2bs=";
const IV_B64 = "6aGtfKPdD5zhPhxX";
const SALT_B64 = "fCHqXI/M51gFOoeSA188Aw==";
// ============================================================

let decryptedWebhookUrl = null;

// Fonctions crypto (Web Crypto API)
async function getKeyFromPassword(password, salt) {
    const enc = new TextEncoder();
    const passwordBuffer = enc.encode(password);
    const saltBuffer = Uint8Array.from(atob(salt), c => c.charCodeAt(0));
    
    const keyMaterial = await crypto.subtle.importKey(
        "raw",
        passwordBuffer,
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
    );
    
    const derivedKey = await crypto.subtle.deriveKey(
        {
            name: "PBKDF2",
            salt: saltBuffer,
            iterations: 100000,
            hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        true,
        ["decrypt"]
    );
    
    return derivedKey;
}

async function decryptWebhook(combinedKey) {
    try {
        // combinedKey = identifiant + motdepasse (ex: "BP-rootmonSuperPassword")
        // Récupérer les données chiffrées
        const encryptedData = Uint8Array.from(atob(ENCRYPTED_WEBHOOK_B64), c => c.charCodeAt(0));
        const iv = Uint8Array.from(atob(IV_B64), c => c.charCodeAt(0));
        const salt = Uint8Array.from(atob(SALT_B64), c => c.charCodeAt(0));
        
        // Dériver la clé à partir du mot de passe complet (identifiant+motdepasse)
        const enc = new TextEncoder();
        const passwordBuffer = enc.encode(combinedKey);
        
        const keyMaterial = await crypto.subtle.importKey(
            "raw",
            passwordBuffer,
            { name: "PBKDF2" },
            false,
            ["deriveKey"]
        );
        
        const key = await crypto.subtle.deriveKey(
            {
                name: "PBKDF2",
                salt: salt,
                iterations: 100000,
                hash: "SHA-256"
            },
            keyMaterial,
            { name: "AES-GCM", length: 256 },
            true,
            ["decrypt"]
        );
        
        const decrypted = await crypto.subtle.decrypt(
            {
                name: "AES-GCM",
                iv: iv,
                tagLength: 128
            },
            key,
            encryptedData
        );
        
        const decoder = new TextDecoder();
        const url = decoder.decode(decrypted);
        
        // Validation basique : doit commencer par https://discord.com/api/webhooks/
        if (!url.startsWith("https://discord.com/api/webhooks/")) {
            throw new Error("URL déchiffrée invalide");
        }
        
        return url;
    } catch (err) {
        console.error("Erreur déchiffrement:", err);
        throw new Error("Échec du déchiffrement : identifiant ou mot de passe incorrect");
    }
}

// Envoi du message via le webhook déchiffré
async function sendWebhookMessage(webhookUrl) {
    // Attention: ajout du paramètre ?with_components=true (facultatif mais gardé)
    const targetUrl = webhookUrl.includes("?") ? webhookUrl + "&with_components=true" : webhookUrl + "?with_components=true";
    
    const payload = {
        flags: 32768,
        components: [
            {
                type: 17,
                accent_color: 5793266,
                components: [
                    {
                        type: 10,
                        content: `# 📜 Rules

### 1 •
> Mentions of @everyone, @here or others are prohibited on this server.
### 2 •
> Prohibition of advertising for a website, bot, application, server, game or other things.

---

Any rule that is not respected will be sanctioned according to the rule that was not respected.`
                    },
                    {
                        type: 14,
                        divider: true,
                        spacing: 1
                    },
                    {
                        type: 1,
                        components: [
                            {
                                type: 2,
                                style: 5,
                                label: "Accept the rules",
                                url: "https://bp-discord.github.io/blocplay/server/rules/accept"
                            }
                        ]
                    }
                ]
            }
        ]
    };
    
    const response = await fetch(targetUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    });
    
    if (!response.ok) {
        const errorText = await response.text();
        throw new Error(`Discord webhook error (${response.status}): ${errorText}`);
    }
    
    return response;
}

// Gestion du login / déchiffrement
async function handleLogin() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    
    const errorDiv = document.getElementById("errorMsg");
    const successDiv = document.getElementById("successMsg");
    const sendBtn = document.getElementById("sendBtn");
    const loginBtn = document.getElementById("loginBtn");
    const statusBadge = document.getElementById("statusBadge");
    
    // Réinitialiser messages
    errorDiv.style.display = "none";
    successDiv.style.display = "none";
    errorDiv.innerText = "";
    successDiv.innerText = "";
    
    // Validation champ identifiant (doit être BP-root exactement)
    if (username !== "BP-root") {
        errorDiv.innerText = "❌ Identifiant incorrect. (doit être 'BP-root')";
        errorDiv.style.display = "block";
        return;
    }
    
    if (password.length === 0) {
        errorDiv.innerText = "❌ Veuillez entrer un mot de passe valide.";
        errorDiv.style.display = "block";
        return;
    }
    
    // Désactiver bouton login pendant l'opération
    loginBtn.disabled = true;
    loginBtn.innerText = "⏳ Déchiffrement en cours...";
    
    try {
        // Reconstruction de la clé au format "identifiantmotdepasse" (sans espace ni séparateur)
        const combinedKey = username + password;   // ex: "BP-rootmonMotDePasse"
        
        // Déchiffrer l'URL du webhook en utilisant la clé combinée
        const webhookUrl = await decryptWebhook(combinedKey);
        
        // Stocker l'URL déchiffrée
        decryptedWebhookUrl = webhookUrl;
        
        // Succès : débloquer le bouton d'envoi
        sendBtn.disabled = false;
        sendBtn.innerText = "✅ Envoyer les règles (déverrouillé)";
        statusBadge.innerHTML = "🔓 Authentifié · Webhook déchiffré";
        statusBadge.style.background = "#10b98120";
        statusBadge.style.color = "#a7f3d0";
        
        successDiv.innerText = "✓ Authentification réussie ! Vous pouvez maintenant envoyer les règles.";
        successDiv.style.display = "block";
        
        // Optionnel: masquer le formulaire de login ou le griser? on garde mais on désactive le login
        loginBtn.innerText = "✔️ Connecté";
        loginBtn.disabled = true;
        document.getElementById("username").disabled = true;
        document.getElementById("password").disabled = true;
        
    } catch (err) {
        errorDiv.innerText = `❌ ${err.message}`;
        errorDiv.style.display = "block";
        sendBtn.disabled = true;
        sendBtn.innerText = "📜 Envoyer les règles (verrouillé)";
        statusBadge.innerHTML = "🔒 Échec authentification";
        statusBadge.style.background = "#1e293b";
        statusBadge.style.color = "#f87171";
        console.error(err);
    } finally {
        loginBtn.disabled = false;
        if (decryptedWebhookUrl) {
            loginBtn.disabled = true;
        } else {
            loginBtn.innerText = "🚪 Se connecter & déverrouiller";
        }
    }
}

// Envoi final du message vers Discord
async function sendMessage() {
    if (!decryptedWebhookUrl) {
        alert("🔒 Impossible d'envoyer : vous n'êtes pas authentifié(e).");
        return;
    }
    
    const sendBtn = document.getElementById("sendBtn");
    const originalText = sendBtn.innerText;
    sendBtn.disabled = true;
    sendBtn.innerText = "⏳ Envoi en cours...";
    
    try {
        await sendWebhookMessage(decryptedWebhookUrl);
        alert("✅ Règles envoyées avec succès sur Discord !");
    } catch (err) {
        console.error("Erreur envoi webhook:", err);
        alert(`❌ Erreur lors de l'envoi : ${err.message}`);
    } finally {
        sendBtn.disabled = false;
        sendBtn.innerText = originalText;
    }
}

// Écouteurs d'événements
document.getElementById("loginBtn").addEventListener("click", handleLogin);
document.getElementById("sendBtn").addEventListener("click", sendMessage);

// Permet de presser "Entrée" pour se connecter
const passwordInput = document.getElementById("password");
const usernameInput = document.getElementById("username");
function tryLoginOnEnter(e) {
    if (e.key === "Enter") {
        e.preventDefault();
        if (!document.getElementById("loginBtn").disabled) {
            handleLogin();
        }
    }
}
passwordInput.addEventListener("keypress", tryLoginOnEnter);
usernameInput.addEventListener("keypress", tryLoginOnEnter);

// Petit message console pour indiquer que l'intégration est prête mais nécessite remplacement des clés
if (ENCRYPTED_WEBHOOK_B64 === "WEBHOOK_CHIFFRE_EN_BASE64" || IV_B64 === "IV_EN_BASE64" || SALT_B64 === "SALT_EN_BASE64") {
    console.warn("⚠️ [BLOCPLAY] Les variables chiffrées ne sont pas configurées. Remplacez ENCRYPTED_WEBHOOK_B64, IV_B64 et SALT_B64 par les valeurs générées.");
    document.getElementById("errorMsg").innerText = "⚠️ Configuration crypto manquante. Remplacez les clés dans le code source.";
    document.getElementById("errorMsg").style.display = "block";
}
</script>

</body>
</html>
